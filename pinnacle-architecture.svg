<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3995a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="blur-kpi" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <filter id="blur-row" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
    .muted { fill: #94a3b8; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; fill: #94a3b8; }
    .accent { fill: #e3995a; }
    .ok { fill: #10b981; }
  </style>

  <!-- Background Canvas -->
  <rect width="760" height="450" rx="10" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="760" height="38" rx="10" fill="#0b1120" />
  <rect x="0" y="28" width="760" height="10" fill="#0b1120" />
  <line x1="0" y1="38" x2="760" y2="38" stroke="#334155" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="5" fill="#ef4444" />
  <circle cx="36" cy="19" r="5" fill="#f59e0b" />
  <circle cx="52" cy="19" r="5" fill="#10b981" />

  <!-- Window Header -->
  <text x="75" y="23" class="mono" font-size="12" fill="#cbd5e1" font-weight="500">pinnacle-erp://distribution.internal/dashboard</text>
  <rect x="580" y="10" width="165" height="18" rx="4" fill="#1e293b" stroke="#334155" />
  <circle cx="592" cy="19" r="3.5" fill="#10b981" />
  <text x="602" y="23" class="mono" font-size="10.5" fill="#94a3b8">TLS 1.3 · PRIVATE CLIENT</text>

  <!-- Architecture Flow Banner -->
  <g transform="translate(18, 50)">
    <rect width="724" height="118" rx="8" fill="#0b1322" stroke="#1e293b" stroke-width="1.2" />
    
    <text x="14" y="20" class="lbl" fill="#e3995a">System Architecture &amp; Data Pipeline</text>
    <text x="545" y="20" class="mono" font-size="11" fill="#64748b">Linux (systemd) + Caddy TLS</text>

    <!-- Node 1: React UI -->
    <g transform="translate(14, 32)">
      <rect width="115" height="68" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)" />
      <text x="10" y="22" class="title" font-size="13" fill="#38bdf8">React UI</text>
      <text x="10" y="38" class="mono" font-size="10" fill="#94a3b8">Vite SPA</text>
      <text x="10" y="52" class="mono" font-size="9.5" fill="#64748b">RBAC State</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(133, 62)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
      <polygon points="30,-3 36,0 30,3" fill="#f59e0b" />
      <text x="2" y="-6" class="mono" font-size="8.5" fill="#f59e0b">HTTPS</text>
    </g>

    <!-- Node 2: Caddy TLS -->
    <g transform="translate(174, 32)">
      <rect width="135" height="68" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2" filter="url(#glow)" />
      <text x="10" y="22" class="title" font-size="13" fill="#10b981">Caddy Server</text>
      <text x="10" y="38" class="mono" font-size="10" fill="#94a3b8">Reverse Proxy</text>
      <text x="10" y="52" class="mono" font-size="9.5" fill="#64748b">Auto Let's Encrypt</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(313, 62)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2" />
      <polygon points="30,-3 36,0 30,3" fill="#10b981" />
      <text x="0" y="-6" class="mono" font-size="8.5" fill="#10b981">proxy:5000</text>
    </g>

    <!-- Node 3: Node.js / Express -->
    <g transform="translate(354, 32)">
      <rect width="160" height="68" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" filter="url(#glow)" />
      <text x="10" y="22" class="title" font-size="13" fill="#c084fc">Node.js API</text>
      <text x="10" y="38" class="mono" font-size="10" fill="#94a3b8">Express Server</text>
      <text x="10" y="52" class="mono" font-size="9.5" fill="#64748b">RBAC + Audit Logger</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(518, 62)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,2" />
      <polygon points="30,-3 36,0 30,3" fill="#a855f7" />
      <text x="2" y="-6" class="mono" font-size="8.5" fill="#c084fc">ACID</text>
    </g>

    <!-- Node 4: SQLite Embedded DB -->
    <g transform="translate(558, 32)">
      <rect width="150" height="68" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" filter="url(#glow)" />
      <text x="10" y="22" class="title" font-size="13" fill="#fbbf24">SQLite DB</text>
      <text x="10" y="38" class="mono" font-size="10" fill="#94a3b8">WAL Mode Storage</text>
      <text x="10" y="52" class="mono" font-size="9.5" fill="#64748b">Encrypted Backups</text>
    </g>
  </g>

  <!-- Section 2: ERP Client Operations Dashboard (Confidential / Blurred) -->
  <g transform="translate(18, 182)">
    <rect width="724" height="252" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

    <!-- Sub-Nav & Live Status -->
    <text x="16" y="24" class="title" font-size="14" fill="#f1f5f9">Beverage Distribution Management Suite</text>
    <rect x="560" y="10" width="150" height="20" rx="4" fill="#14532d" fill-opacity="0.5" stroke="#22c55e" stroke-width="0.8" />
    <circle cx="572" cy="20" r="3" fill="#22c55e" />
    <text x="581" y="23.5" class="mono" font-size="10" fill="#86efac" font-weight="600">AUDIT LOCK ACTIVE</text>

    <!-- Navigation Pills -->
    <g transform="translate(16, 36)">
      <rect width="76" height="22" rx="4" fill="#334155" />
      <text x="12" y="15" class="mono" font-size="10.5" fill="#f8fafc" font-weight="500">Dashboard</text>

      <rect x="84" width="74" height="22" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="96" y="15" class="mono" font-size="10.5" fill="#94a3b8">Inventory</text>

      <rect x="166" width="70" height="22" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="186" y="15" class="mono" font-size="10.5" fill="#94a3b8">Sales</text>

      <rect x="244" width="78" height="22" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="257" y="15" class="mono" font-size="10.5" fill="#94a3b8">Returns</text>

      <rect x="330" width="86" height="22" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="342" y="15" class="mono" font-size="10.5" fill="#94a3b8">Audit Logs</text>

      <rect x="424" width="86" height="22" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="438" y="15" class="mono" font-size="10.5" fill="#94a3b8">User Roles</text>
    </g>

    <!-- 4 KPI Cards (Values Blurred for Client Confidentiality) -->
    <g transform="translate(16, 68)">
      <!-- KPI 1 -->
      <g transform="translate(0, 0)">
        <rect width="166" height="60" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="10" y="18" class="lbl" font-size="10">Active Stock (Cases)</text>
        <g filter="url(#blur-kpi)">
          <text x="10" y="44" class="title" font-size="19" fill="#38bdf8">42,850 Cts</text>
        </g>
        <text x="110" y="44" class="mono" font-size="10" fill="#10b981">+12.4%</text>
      </g>

      <!-- KPI 2 -->
      <g transform="translate(176, 0)">
        <rect width="166" height="60" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="10" y="18" class="lbl" font-size="10">Sales Revenue (MTD)</text>
        <g filter="url(#blur-kpi)">
          <text x="10" y="44" class="title" font-size="19" fill="#f59e0b">&#x20A6;84,210,500</text>
        </g>
        <text x="135" y="44" class="mono" font-size="10" fill="#10b981">LIVE</text>
      </g>

      <!-- KPI 3 -->
      <g transform="translate(352, 0)">
        <rect width="166" height="60" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="10" y="18" class="lbl" font-size="10">Returns Reconciliation</text>
        <g filter="url(#blur-kpi)">
          <text x="10" y="44" class="title" font-size="19" fill="#cbd5e1">128 Cases</text>
        </g>
        <text x="116" y="44" class="mono" font-size="10" fill="#94a3b8">Pending</text>
      </g>

      <!-- KPI 4 -->
      <g transform="translate(528, 0)">
        <rect width="164" height="60" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="10" y="18" class="lbl" font-size="10">Audit Log Integrity</text>
        <text x="10" y="44" class="title" font-size="18" fill="#10b981">100% OK</text>
        <text x="100" y="44" class="mono" font-size="9.5" fill="#64748b">SHA-256</text>
      </g>
    </g>

    <!-- Audit & Transaction Log Table Preview -->
    <g transform="translate(16, 138)">
      <rect width="692" height="102" rx="6" fill="#0b1322" stroke="#334155" stroke-width="0.8" />
      
      <!-- Table Header -->
      <rect width="692" height="24" rx="6" fill="#1e293b" />
      <rect y="18" width="692" height="6" fill="#1e293b" />
      <text x="14" y="16" class="mono" font-size="10" fill="#94a3b8" font-weight="600">TIMESTAMP (UTC)</text>
      <text x="140" y="16" class="mono" font-size="10" fill="#94a3b8" font-weight="600">OPERATOR</text>
      <text x="250" y="16" class="mono" font-size="10" fill="#94a3b8" font-weight="600">TRANSACTION / ACTION</text>
      <text x="470" y="16" class="mono" font-size="10" fill="#94a3b8" font-weight="600">SKU / INVOICE REF</text>
      <text x="615" y="16" class="mono" font-size="10" fill="#94a3b8" font-weight="600">STATUS</text>

      <!-- Row 1 (Blurred Data) -->
      <g transform="translate(14, 38)">
        <text x="0" y="0" class="mono" font-size="10" fill="#64748b">2026-11-15 14:22:04</text>
        <g filter="url(#blur-row)">
          <text x="126" y="0" class="mono" font-size="10" fill="#cbd5e1">wh_manager_01</text>
          <text x="236" y="0" class="mono" font-size="10" fill="#e2e8f0">INVENTORY_RESTOCK_BATCH</text>
          <text x="456" y="0" class="mono" font-size="10" fill="#cbd5e1">SKU-BEV-LAG-0842 (2,400cs)</text>
        </g>
        <text x="601" y="0" class="mono" font-size="10" fill="#10b981" font-weight="600">COMMITTED</text>
      </g>

      <!-- Row 2 (Blurred Data) -->
      <g transform="translate(14, 58)">
        <text x="0" y="0" class="mono" font-size="10" fill="#64748b">2026-11-15 14:18:31</text>
        <g filter="url(#blur-row)">
          <text x="126" y="0" class="mono" font-size="10" fill="#cbd5e1">sales_rep_lead</text>
          <text x="236" y="0" class="mono" font-size="10" fill="#e2e8f0">SALE_OR_RETURN_SETTLE</text>
          <text x="456" y="0" class="mono" font-size="10" fill="#cbd5e1">INV-2026-11082 (Verified)</text>
        </g>
        <text x="601" y="0" class="mono" font-size="10" fill="#10b981" font-weight="600">COMMITTED</text>
      </g>

      <!-- Row 3 (Blurred Data) -->
      <g transform="translate(14, 78)">
        <text x="0" y="0" class="mono" font-size="10" fill="#64748b">2026-11-15 14:02:19</text>
        <g filter="url(#blur-row)">
          <text x="126" y="0" class="mono" font-size="10" fill="#cbd5e1">sysadmin_root</text>
          <text x="236" y="0" class="mono" font-size="10" fill="#e2e8f0">ROLE_ACCESS_VERIFY</text>
          <text x="456" y="0" class="mono" font-size="10" fill="#cbd5e1">UID-492 (Least-Privilege)</text>
        </g>
        <text x="601" y="0" class="mono" font-size="10" fill="#38bdf8" font-weight="600">VERIFIED</text>
      </g>
    </g>
  </g>
</svg>
